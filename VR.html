<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VR With Event & Animation</title>

  <!-- A-Frame dan ekstensi tambahan -->
  <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.0/dist/aframe-extras.min.js"></script>
  <script src="https://unpkg.com/aframe-event-set-component@5.0.0/dist/aframe-event-set-component.min.js"></script>
  <script src="https://unpkg.com/aframe-proxy-event-component/dist/aframe-proxy-event-component.min.js"></script>
  <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
  <script src="https://unpkg.com/super-hands@3.0.0/dist/super-hands.min.js"></script>

  <style>
    /* Cursor custom untuk tombol interaktif */
    .a-grab-cursor {
      cursor: crosshair !important;
    }

    .a-grab-cursor:active {
      cursor: grabbing !important;
    }
  </style>

  <script>
    // Komponen untuk tombol 'UP'
    var number = 0;
    AFRAME.registerComponent('tester1', {
      init: function () {
        var el = this.el;
        el.addEventListener('mouseenter', function () {
          console.log(`It works for up ${number++}`, 'font-size:2em');
        });
      }
    });

    // Komponen untuk tombol 'DOWN'
    AFRAME.registerComponent('tester2', {
      init: function () {
        var el = this.el;
        el.addEventListener('mouseenter', function () {
          console.log(`It works for down ${number++}`, 'font-size:2em');
        });
      }
    });

    // Fungsi pengelolaan audio dan kontrol model 3D

    let songs = [];
    for (let i = 1; i <= 6; i++) {
      songs.push(`sounds/Lagu${i}.mp3`);
    }

    let currentSong = 0;
    let audio = new Audio(songs[currentSong]);
    let isRotating = false;

    // Komponen rotasi kustom
    AFRAME.registerComponent('rotate-model', {
      schema: { speed: { type: 'number', default: 30 } },

      tick: function (time, timeDelta) {
        if (isRotating) {
          let rotation = this.el.getAttribute('rotation');
          rotation.y += (this.data.speed * timeDelta) / 1000;
          this.el.setAttribute('rotation', rotation);
        }
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      let modelEl = document.querySelector('#box');
      modelEl.setAttribute('rotate-model', 'speed: 60');

      audio.addEventListener('play', () => {
        isRotating = true;
      });

      audio.addEventListener('pause', () => {
        isRotating = false;
      });

      audio.addEventListener('ended', () => {
        nextSong();
      });
    });

    function playPause() {
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    }

    function nextSong() {
      currentSong = (currentSong + 1) % songs.length;
      audio.src = songs[currentSong];
      audio.play();
    }

    function prevSong() {
      currentSong = (currentSong - 1 + songs.length) % songs.length;
      audio.src = songs[currentSong];
      audio.play();
    }
  </script>

  </script>
</head>

<body>
  <a-scene>
    <!-- Kamera dengan cursor mouse -->
    <a-camera id="cam">
      <a-entity cursor="rayOrigin:mouse"></a-entity>
    </a-camera>

    <!-- Tombol UP -->
    <a-entity geometry="primitive: triangle" text__btn_up="align: center; baseline:top; value:UP; wrapCount:5"
      position="3 2.5 -3" material="color:black;" look-at="#cam" proxy-event__satu="event:click; as:atas; to:#box;">
    </a-entity>

    <!-- Tombol DOWN -->
    <a-entity tester2 position="3 0.5 -3" text__btn_up="align:center; baseline:bottom; value:DOWN; wrapCount:10"
      look-at="#cam">
      <a-entity geometry="primitive:triangle" rotation="0 0 180" material="color:black;"
        proxy-event__satu="event:click; as:bawah; to:#box;">
      </a-entity>
    </a-entity>

    <a-entity
        geometry="primitive: plane; height: 0.5; width: 1.5"
        position="-2 2.5 -3"
        material="color: black;"
        text="value: << Prev; color:white; align: center; width: 4 position: 0 0 0.111"
        class="a-grab-cursor"
        onclick="prevSong()"
      ></a-entity>

      <!-- Tombol untuk Play/Pause -->
      <a-entity
        geometry="primitive: plane; height: 0.5; width: 1.5"
        position="-2 1.5 -3"
        material="color: black;"
        text="value: Play/Pause; align: center; width: 3"
        class="a-grab-cursor"
        onclick="playPause()"
      ></a-entity>

      <!-- Tombol untuk Next -->
      <a-entity
        geometry="primitive: plane; height: 0.5; width: 1.5"
        position="-2 0.5 -3"
        material="color: black;"
        text="value: Next >>; color:white; align: center; width: 3"
        class="a-grab-cursor"
        onclick="nextSong()"
      ></a-entity>


    <!-- Model 3D dengan animasi -->
    <a-gltf-model grabbable id="box" position="0.15 1 -1" gltf-model="url(models/funnycat.glb)"
      animation__atas="property:position; to:0 2.5 -3; startEvents:atas"
      animation__bawah="property:position; to:0 -1 -3; startEvents:bawah"
      animation__reset="property:position; to:0 0.5 -3; startEvents:click"
      animation__rotateModel="property: rotation; to: 0 360 0; dur: 3000; loop: true; startEvents: startRotation; pauseEvents: stopRotation">
    </a-gltf-model>

    <a-entity laser-controls="hand:rigth;color:red;"></a-entity>

  </a-scene>
</body>

</html>
